<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Creator Finder</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 800px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 10px;
        }

        .header h1 {
            font-size: 2.2rem;
            margin-bottom: 8px;
        }

        .header p {
            opacity: 0.9;
            font-size: 0.95rem;
        }

        .card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.15);
        }

        .input-group {
            display: flex;
            gap: 12px;
            margin-bottom: 8px;
        }

        input[type="text"] {
            flex: 1;
            padding: 14px 18px;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            font-size: 1rem;
            outline: none;
            transition: all 0.2s;
        }

        input[type="text"]:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.2);
        }

        button {
            padding: 14px 28px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover {
            background: #5a67d8;
        }

        button:disabled {
            background: #a0aec0;
            cursor: not-allowed;
        }

        .hint {
            font-size: 0.85rem;
            color: #718096;
            margin-left: 4px;
        }

        .result-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            padding-bottom: 12px;
            border-bottom: 1px solid #edf2f7;
        }

        .result-title {
            font-size: 1.2rem;
            font-weight: 700;
            color: #2d3748;
        }

        .status-badge {
            font-size: 0.85rem;
            padding: 4px 12px;
            border-radius: 20px;
            background: #edf2f7;
            color: #4a5568;
        }

        .status-badge.loading {
            background: #feebc8;
            color: #c05621;
        }

        .status-badge.success {
            background: #c6f6d5;
            color: #22543d;
        }

        .status-badge.error {
            background: #fed7d7;
            color: #9b2c2c;
        }

        .result-content {
            font-size: 1rem;
            line-height: 1.7;
            color: #2d3748;
            white-space: pre-wrap;
            word-break: break-word;
            min-height: 120px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>AI Creator Finder</h1>
            <p>帮助海外 AI 产品运营人员，在找达人之前快速确定「应该找什么样的达人」</p>
        </div>

        <div class="card">
            <div class="input-group">
                <input type="text" id="userInput" placeholder="例如：ChatGPT 美国 tiktok">
                <button id="submitBtn" onclick="generateStrategy()">Generate</button>
            </div>
            <div class="hint">输入格式：AI 产品名称 + 目标国家 + 社交媒体平台</div>
        </div>

        <div class="card">
            <div class="result-header">
                <div class="result-title">生成结果</div>
                <div class="status-badge" id="statusBadge">准备就绪</div>
            </div>
            <div class="result-content" id="resultContent">等待输入生成...</div>
        </div>
    </div>

    <script>
        async function generateStrategy() {
            const inputVal = document.getElementById('userInput').value.trim();
            const btn = document.getElementById('submitBtn');
            const statusBadge = document.getElementById('statusBadge');
            const resultContent = document.getElementById('resultContent');

            if (!inputVal) {
                alert('请输入内容');
                return;
            }

            btn.disabled = true;
            statusBadge.className = 'status-badge loading';
            statusBadge.innerText = '生成中...';
            resultContent.innerText = '';

            // 1. 构建符合 Coze ClientMessage 标准格式的请求体
            const payload = {
                type: "query",
                session_id: "session-" + Date.now(),
                content: {
                    query: {
                        prompt: [{
                            type: "text",
                            content: { text: inputVal }
                        }]
                    }
                }
            };

            try {
                // 2. 发起请求
                const response = await fetch('https://74q7m3vpzh.coze.site/stream_run', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(payload)
                });

                if (!response.ok) {
                    throw new Error(`HTTP 错误！状态码: ${response.status}`);
                }

                // 3. 读取流数据并解析
                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                let resultText = "";
                let buffer = "";

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;

                    buffer += decoder.decode(value, { stream: true });
                    const lines = buffer.split("\n");
                    buffer = lines.pop(); // 保持未接收完整的一行

                    for (const line of lines) {
                        if (line.startsWith("data:")) {
                            const jsonStr = line.replace(/^data:\s*/, "").trim();
                            if (!jsonStr) continue;

                            try {
                                const parsed = JSON.parse(jsonStr);

                                // 关键修复：只提取 content.answer 中的文本，解决 [object Object] 的渲染问题
                                if (parsed.type === "answer" && parsed.content && parsed.content.answer) {
                                    resultText += parsed.content.answer;
                                    resultContent.innerText = resultText;
                                }
                            } catch (e) {
                                console.error("解析单行 JSON 失败:", e);
                            }
                        }
                    }
                }

                statusBadge.className = 'status-badge success';
                statusBadge.innerText = '已完成';

            } catch (err) {
                statusBadge.className = 'status-badge error';
                statusBadge.innerText = '出错了';
                resultContent.innerHTML = `<span style="color: #e53e3e;">请求失败: ${err.message}</span>`;
            } finally {
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
