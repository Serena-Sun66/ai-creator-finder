<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Creator Finder</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 40px 20px;
            color: #333;
        }

        .container {
            width: 100%;
            max-width: 800px;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 10px;
        }

        .header h1 {
            font-size: 2.2rem;
            font-weight: 700;
            margin-bottom: 12px;
        }

        .header p {
            font-size: 1rem;
            opacity: 0.9;
        }

        .card {
            background: white;
            border-radius: 16px;
            padding: 28px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
        }

        .input-group {
            display: flex;
            gap: 12px;
            margin-bottom: 12px;
        }

        input[type="text"] {
            flex: 1;
            padding: 14px 18px;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }

        input[type="text"]:focus {
            border-color: #667eea;
        }

        button {
            background: #667eea;
            color: white;
            border: none;
            padding: 0 28px;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover {
            background: #5a67d8;
        }

        button:disabled {
            background: #a0aec0;
            cursor: not-allowed;
        }

        .hint {
            font-size: 0.85rem;
            color: #718096;
        }

        .result-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .result-title {
            font-size: 1.25rem;
            font-weight: 600;
            color: #2d3748;
        }

        .status-badge {
            font-size: 0.85rem;
            padding: 4px 12px;
            border-radius: 20px;
            font-weight: 500;
            display: none;
        }

        .status-badge.loading {
            display: inline-block;
            background: #ebf8ff;
            color: #3182ce;
        }

        .status-badge.error {
            display: inline-block;
            background: #fed7d7;
            color: #e53e3e;
        }

        .result-content {
            min-height: 120px;
            line-height: 1.6;
            color: #4a5568;
            white-space: pre-wrap;
            word-break: break-word;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>AI Creator Finder</h1>
            <p>帮助海外 AI 产品运营人员，在找达人之前快速确定「应该找什么样的达人」</p>
        </div>

        <div class="card">
            <div class="input-group">
                <input type="text" id="queryInput" placeholder="chatGPT 美国 tiktok" value="chatGPT 美国 tiktok">
                <button id="generateBtn" onclick="generateStrategy()">Generate</button>
            </div>
            <div class="hint">输入格式：AI 产品名称 + 目标国家 + 社交媒体平台</div>
        </div>

        <div class="card">
            <div class="result-header">
                <div class="result-title">生成结果</div>
                <div id="statusBadge" class="status-badge"></div>
            </div>
            <div id="resultContent" class="result-content">等待生成...</div>
        </div>
    </div>

    <script>
        async function generateStrategy() {
            const input = document.getElementById('queryInput');
            const btn = document.getElementById('generateBtn');
            const statusBadge = document.getElementById('statusBadge');
            const resultContent = document.getElementById('resultContent');

            const query = input.value.trim();
            if (!query) {
                alert('请输入查询内容');
                return;
            }

            // UI 状态更新
            btn.disabled = true;
            statusBadge.className = 'status-badge loading';
            statusBadge.innerText = '生成中...';
            resultContent.innerText = '';

            try {
                const response = await fetch('https://74q7m3vpzh.coze.site/stream_run', {
                    method: 'POST',
                    headers: {
                        'Authorization': 'Bearer sat_5DrYitM0jXHyrHlLdRAdflKpYFVK0CiJnK3huw4O6SOUm2ETzbZyMRbrcaKNy3HS',
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ input: query })
                });

                if (!response.ok) {
                    const errText = await response.text();
                    throw new Error(`HTTP ${response.status}: ${errText}`);
                }

                // 处理 SSE 数据流 / 普通文本响应
                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                let fullText = '';

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;

                    const chunk = decoder.decode(value, { stream: true });
                    const lines = chunk.split('\n');

                    for (const line of lines) {
                        if (line.startsWith('data:')) {
                            const jsonStr = line.replace(/^data:\s*/, '').trim();
                            if (jsonStr) {
                                try {
                                    const parsed = JSON.parse(jsonStr);
                                    if (parsed.content) {
                                        fullText += parsed.content;
                                        resultContent.innerText = fullText;
                                    } else if (parsed.message) {
                                        fullText += parsed.message;
                                        resultContent.innerText = fullText;
                                    }
                                } catch (e) {
                                    fullText += jsonStr;
                                    resultContent.innerText = fullText;
                                }
                            }
                        } else if (line.trim() && !line.startsWith('event:')) {
                            fullText += line + '\n';
                            resultContent.innerText = fullText;
                        }
                    }
                }

                if (!fullText) {
                    resultContent.innerText = "生成完成，但未返回文本内容。";
                }

                statusBadge.style.display = 'none';

            } catch (err) {
                statusBadge.className = 'status-badge error';
                statusBadge.innerText = '出错了';
                resultContent.innerHTML = `<span style="color: #e53e3e;">请求失败: ${err.message}</span>`;
            } finally {
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
