<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Creator Finder</title>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px;
    }
    .container { width: 100%; max-width: 800px; }
    .header { text-align: center; margin-bottom: 32px; color: #fff; }
    .header h1 { font-size: 2.5rem; font-weight: 700; margin-bottom: 12px; }
    .header p { font-size: 1.1rem; opacity: 0.85; }
    
    .card {
      background: rgba(255, 255, 255, 0.95);
      border-radius: 16px;
      padding: 32px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.15);
      margin-bottom: 24px;
    }
    
    .input-group { display: flex; gap: 12px; margin-bottom: 16px; }
    .input-group input {
      flex: 1;
      padding: 14px 20px;
      border: 2px solid #e2e8f0;
      border-radius: 10px;
      font-size: 1rem;
      outline: none;
      transition: all 0.3s;
    }
    .input-group input:focus { border-color: #667eea; }
    .input-group button {
      padding: 14px 28px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.3s;
    }
    .input-group button:hover { opacity: 0.9; }
    .input-group button:disabled { opacity: 0.6; cursor: not-allowed; }
    
    .hint { font-size: 0.875rem; color: #718096; }
    
    .result-title {
      font-size: 1.25rem;
      font-weight: 600;
      color: #2d3748;
      margin-bottom: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .status-tag {
      font-size: 0.75rem;
      padding: 4px 12px;
      border-radius: 20px;
      background: #edf2f7;
      color: #4a5568;
    }
    
    #result-content {
      color: #2d3748;
      line-height: 1.7;
      min-height: 100px;
      word-break: break-word;
    }
    #result-content p { margin-bottom: 12px; }
    #result-content ul, #result-content ol { padding-left: 20px; margin-bottom: 12px; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>AI Creator Finder</h1>
      <p>帮助海外 AI 产品运营人员，在找达人之前快速确定「应该找什么样的达人」</p>
    </div>

    <div class="card">
      <div class="input-group">
        <input type="text" id="query-input" placeholder="例如：ChatGPT, 美国, TikTok" />
        <button id="generate-btn" onclick="handleGenerate()">Generate</button>
      </div>
      <div class="hint">输入格式：AI 产品名称 + 目标国家 + 社交媒体平台</div>
    </div>

    <div class="card">
      <div class="result-title">
        <span>生成结果</span>
        <span class="status-tag" id="status-tag">等待输入</span>
      </div>
      <div id="result-content">未收到有效响应，请稍后重试。</div>
    </div>
  </div>

  <script>
    async function handleGenerate() {
      const inputEl = document.getElementById('query-input');
      const btnEl = document.getElementById('generate-btn');
      const statusEl = document.getElementById('status-tag');
      const resultEl = document.getElementById('result-content');
      
      const query = inputEl.value.trim();
      if (!query) {
        alert('请输入查询内容！');
        return;
      }

      btnEl.disabled = true;
      statusEl.textContent = '生成中...';
      statusEl.style.background = '#ebf8ff';
      statusEl.style.color = '#3182ce';
      resultEl.innerHTML = '正在为您匹配推荐达人类型，请稍候...';

      try {
        const response = await fetch('/api/generate', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ query: query })
        });

        if (!response.ok) {
          throw new Error(`请求失败，状态码: ${response.status}`);
        }

        // 读取响应文本（SSE 格式）
        const textData = await response.text();
        let extractedText = '';

        // 提取流数据中的 content 字段
        const lines = textData.split('\n');
        for (const line of lines) {
          if (line.startsWith('data:')) {
            try {
              const jsonStr = line.slice(5).trim();
              if (jsonStr && jsonStr !== '[DONE]') {
                const parsed = JSON.parse(jsonStr);
                if (parsed.content) {
                  extractedText += parsed.content;
                } else if (parsed.message && parsed.message.content) {
                  extractedText += parsed.message.content;
                }
              }
            } catch (e) {
              // 忽略无法直接 parse 的行
            }
          }
        }

        // 如果没有解析出特定 data 格式，直接过滤原文本展示
        if (!extractedText.trim()) {
          extractedText = textData.replace(/event:.*?\n/g, '').replace(/data:\s*/g, '');
        }

        // 使用 marked 渲染结果
        resultEl.innerHTML = typeof marked !== 'undefined' ? marked.parse(extractedText) : extractedText;
        
        statusEl.textContent = '生成完毕';
        statusEl.style.background = '#f0fff4';
        statusEl.style.color = '#38a169';

      } catch (err) {
        resultEl.innerHTML = `<span style="color: #e53e3e;">生成失败：${err.message}</span>`;
        statusEl.textContent = '请求异常';
        statusEl.style.background = '#fff5f5';
        statusEl.style.color = '#e53e3e';
      } finally {
        btnEl.disabled = false;
      }
    }
  </script>
</body>
</html>
